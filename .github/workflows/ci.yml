name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore Tec.slnx

      - name: Verificar formato
        run: dotnet format Tec.slnx --verify-no-changes --no-restore

      - name: Compilar
        run: dotnet build Tec.slnx --configuration Release --no-restore

      - name: Pruebas
        run: dotnet test Tec.slnx --configuration Release --no-build
